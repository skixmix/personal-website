- title: SerieSimili
  type: website
  description: |
    SerieSimili.it was a TV show recommendation website, operating similarly (pun intended) to FilmSimili.it.
    It helped users discover new shows through automated recommendations. I shut it down in April 2026,
    as it was no longer actively maintained and had stopped sustaining itself through ads.
  image: images/seriesimili.webp
  keypoints:
    point1: Developed with HTML, PHP, JavaScript
    point2: Automatically extracts tv shows tags and other features utilizing Python
    point3: Automatically recommends top tv shows to users utilizing the data stored on the MySQL database
