baseURL = "https://simonetavoletta.it"
languageCode = "en-us"
title = "Simone Tavoletta"
enableGitInfo = true

[module]
  [[module.mounts]]
    source = "assets"
    target = "assets"
  [[module.mounts]]
    source = "static/fonts"
    target = "assets/fonts"
  [[module.imports]]
    path = "github.com/adityatelange/hugo-PaperMod"

[params]
  # Site description for SEO
  description = "Senior Software Engineer specializing in backend development with NestJS, Node.js, and ai-native solutions"
  keywords = ["Software Engineer", "Backend Developer", "NestJS", "TypeScript", "Lucca Italy"]
  
  # Author info
  author = "Simone Tavoletta"
  
  # Date format
  DateFormat = "Jan 2006"
  defaultTheme = "dark"
  
  # Enable emoji globally
  enableEmoji = true
  
  # Hide RSS link
  hideRSS = false
  
  # Custom CSS - Tokyo Night styling
  customCSS = ["css/extended"]
  
  # Show reading time
  ShowReadingTime = true
  
  # Show word count
  ShowWordCount = true
  
  # Show lastmod for git info
  showLastmod = true
  
  # Toc configuration
  Toc = true
  TocOpen = false
  
  # Profile mode settings for home page
  [params.homeInfoParams]
    Title = "Hi, I'm Simone Tavoletta"
    Content = '''
    Senior Software Engineer specializing in backend development with NestJS, Node.js, and ai-native solutions.

    Navigate to **[Portfolio](/portfolio)** for more info about my personal projects.

    Feel free to reach out: **s.tavoletta@filmsimili.it**
    '''
    # Use profile image
    imageURL = "images/photo-st.webp"

  # Social icons - PaperMod style
  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/skixmix"
  
  [[params.socialIcons]]
    name = "linkedin"
    url = "https://www.linkedin.com/in/simonetavoletta/"

  # Logo settings
  # disabled = false
  # home = "images/photo-st.webp"

# Navigation menu
[menu]
  [[menu.main]]
    name = "Home"
    pageRef = "/"
    weight = 1
  
  [[menu.main]]
    name = "Portfolio"
    pageRef = "/portfolio"
    weight = 2
  
  [[menu.main]]
    name = "Blog"
    pageRef = "/blog"
    weight = 3

# SEO settings
[privacy]
  [privacy.googleAnalytics]
    anonymizeIP = true

[mediaTypes]
  [mediaTypes."application/atom"]
    suffixes = ["xml"]

[outputFormats]
  [outputFormats.feed]
    mediatype = "application/atom"
    baseName = "feed"

# Hugo internal templates for SEO
[outputs]
  home = ["HTML", "RSS", "JSON"]

# Markup configuration
[markup]
  [markup.highlight]
    anchorLineNos = false
    codeFences = true
    guessSyntax = false
    hl_Lines = ''
    hl_inline = false
    lineAnchors = ''
    lineNoStart = 1
    lineNos = false
    lineNumbersInTable = true
    noClasses = false
    noHl = false
    style = 'tokyo-night-dark'
    tabWidth = 2
  
  [markup.goldmark.renderer]
    unsafe = true
  
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 6
